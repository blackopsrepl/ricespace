# Cut a release from a tag.
#
# The client is a Ruby gem, so there is no build matrix and no cross-compilation: a pure-Ruby
# gem is the same file everywhere, and the artifact worth publishing is that one file plus the
# notes. An earlier version of this workflow built a Rust binary per platform; the client was
# ported to Ruby and the matrix was left behind, which would have failed on the first tag after
# the port and published no release at all.
#
# Push a tag and this runs the gate, builds the gem the tag's tree produces, and attaches it to
# the release. The gate runs on the tagged commit rather than on the default branch, so what
# publishes is what was tested.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - name: Run the gate
        run: bin/ci

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build the gem
        run: |
          cd cli
          gem build ricespace.gemspec --output ../ricespace.gem
      - name: Check the gem carries the version the tag says
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ruby -e 'require "rubygems/package"; puts Gem::Package.new("ricespace.gem").spec.version')"
          echo "tag=$tag gem=$built"
          test "$tag" = "$built" || { echo "the gem says $built but the tag says $tag"; exit 1; }
      - name: Install it, so a release is never publishing something that cannot be installed
        run: |
          gem install --local ricespace.gem --user-install --no-document
          # The gem home is the versioned directory and its `bin` is what holds the wrapper —
          # taking the parent of the gem home finds nothing, because that `bin` belongs to the
          # Ruby, not to the gem. The wrapper is also named `<name>.ruby<major.minor>` on some
          # RubyGems versions and bare `<name>` on others, so it is found rather than guessed.
          bin="$(gem env user_gemhome)/bin"
          exe="$(ls "$bin"/ricespace* | head -1)"
          echo "running $exe"
          "$exe" --version
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ricespace.gem
          generate_release_notes: true
