name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run the gate
        run: bin/ci

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          cd cli
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd cli
          cp target/${{ matrix.target }}/release/ricespace ricespace-${{ matrix.suffix }}
          sha256sum ricespace-${{ matrix.suffix }} > ricespace-${{ matrix.suffix }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ricespace-${{ matrix.suffix }}
          path: |
            cli/ricespace-${{ matrix.suffix }}
            cli/ricespace-${{ matrix.suffix }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
