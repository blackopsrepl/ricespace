name: release

# A release is a tag. Push `v0.2.0` and this builds the CLI for the platforms somebody
# actually builds on, attaches the binaries to a GitHub release, and writes the checksums
# beside them. Nothing here runs on a branch push — a version is a decision.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The gate. A release whose tests fail is not a release, and it is cheaper to find that
  # out here than after the binaries are attached to a tag somebody has already linked.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site processes image variants with libvips, and a runner does not have it —
      # which turns a test that renders a thumbnail into "undefined method 'new' for nil"
      # rather than anything that names the missing library.
      - name: libvips, for the image variants
        run: sudo apt-get update && sudo apt-get install -y libvips

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/ci
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path cli/Cargo.toml

  # One static binary per platform. musl for Linux so the artifact runs on any
  # distribution rather than only the one that built it — this CLI is handed to people on
  # machines nobody here can see.
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

          # Cross-compiling to musl on another architecture needs a target-prefixed
          # compiler: `ring` (arriving through ureq's TLS) looks for `aarch64-linux-musl-gcc`
          # and reports "No such file or directory", naming neither the package nor the
          # reason. Ubuntu has no such package for musl targets, so the toolchain comes from
          # musl.cc, which is what the Rust ecosystem uses for this.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/musl-cross.tgz
            sudo tar xzf /tmp/musl-cross.tgz -C /opt
            echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

            # Cargo needs to be told which linker to use for this target; the prefixed
            # compiler on PATH is not enough on its own.
            mkdir -p "$HOME/.cargo"
            printf '[target.aarch64-unknown-linux-musl]\nlinker = "aarch64-linux-musl-gcc"\n' >> "$HOME/.cargo/config.toml"
          fi

      - run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      # The archive name is what install.sh looks for, so it carries the tag and the
      # platform and nothing else.
      - name: package
        run: |
          cd cli/target/${{ matrix.target }}/release
          tar czf ricespace-${{ matrix.name }}.tar.gz ricespace
          shasum -a 256 ricespace-${{ matrix.name }}.tar.gz > ricespace-${{ matrix.name }}.tar.gz.sha256

      # Prove the artifact runs before it is published. A binary that cannot print its
      # own version is not a binary anybody should download.
      - name: the artifact runs
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cd cli/target/${{ matrix.target }}/release
          ./ricespace --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            cli/target/${{ matrix.target }}/release/ricespace-${{ matrix.name }}.tar.gz
            cli/target/${{ matrix.target }}/release/ricespace-${{ matrix.name }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: what is being published
        run: ls -la dist/

      # Notes come from the tag's own commit, not from a hand-kept list. The release is
      # the tag; anything else drifts from it.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
