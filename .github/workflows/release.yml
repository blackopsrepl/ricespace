name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - name: Run the gate
        run: bin/ci

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd cli
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd cli
          cp target/${{ matrix.target }}/release/ricespace ricespace-${{ matrix.suffix }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ricespace-${{ matrix.suffix }} > ricespace-${{ matrix.suffix }}.sha256
          else
            shasum -a 256 ricespace-${{ matrix.suffix }} > ricespace-${{ matrix.suffix }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ricespace-${{ matrix.suffix }}
          path: |
            cli/ricespace-${{ matrix.suffix }}
            cli/ricespace-${{ matrix.suffix }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
