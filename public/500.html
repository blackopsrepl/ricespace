<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Something broke — RiceSpace</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <!-- public/500.html. Served when the app raised, so it cannot use the layout or helpers.
         It says what happened in plain words, offers the way back, and does not pretend the
         reader can fix it — the person seeing this is a visitor, not the operator. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      html { font-size: 16px; -webkit-text-size-adjust: 100%; }
      body {
        background: #09090b; color: #e4e4e7;
        font-family: ui-monospace, "Iosevka", SFMono-Regular, Menlo, monospace;
        line-height: 1.5; min-height: 100dvh;
        display: grid; place-items: center; padding: 2rem;
      }
      main { width: min(100%, 34rem); }
      .mark { display: block; width: 56px; height: 56px; margin-bottom: 1.5rem; }
      p.code { color: #f87171; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
      h1 { font-size: 1.5rem; font-weight: 600; margin-top: 0.5rem; letter-spacing: -0.01em; }
      p.why { color: #a1a1aa; margin-top: 0.75rem; font-size: 0.9rem; }
      nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      a {
        display: inline-block; border: 1px solid #3f3f46; padding: 0.5rem 0.9rem;
        font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase;
        color: #e4e4e7; text-decoration: none;
      }
      a:hover { border-color: #fbbf24; color: #fbbf24; }
      footer { margin-top: 2.5rem; color: #52525b; font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon.svg" alt="" width="56" height="56">
      <p class="code">500 — it broke</p>
      <h1>That one is on us.</h1>
      <p class="why">
        Something on the site failed while building this page. It is not your mistake and there
        is nothing to retry — going back and asking for it again may work.
      </p>
      <nav>
        <a href="/">The front page</a>
        <a href="/layouts">Layouts</a>
      </nav>
      <footer>RiceSpace — pages you build</footer>
    </main>
  </body>
</html>
