# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# The client is Ruby in this repository, so one linter covers the whole thing. Without
# this RuboCop only walks the Rails app and the CLI is unlinted — which is most of the
# value of having it be Ruby.
AllCops:
  NewCops: enable
  Include:
    - "cli/**/*.rb"
    - "cli/exe/*"
    - "tools/**/*.rb"
    # The scripts in bin/ are excluded below rather than included here: `bin/*` in Include
    # does not get picked up by RuboCop's file discovery, and the ones that matter are the
    # project's own scripts, which `bin/ci` names explicitly. The Rails-generated wrappers
    # (`bin/rails`, `bin/rake`, `bin/setup`, …) are excluded because they are framework code
    # this project does not own.
  Exclude:
    - "cli/**/*.gemspec"
    - "db/schema.rb"
    # Framework wrappers, regenerated by Rails and not this project's code.
    - "bin/rails"
    - "bin/rake"
    - "bin/setup"
    - "bin/thrust"
    - "bin/brakeman"
    - "bin/bundler-audit"
    - "bin/importmap"
